<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">DiTing — thinking protocol hero</title>
  <desc id="desc">DiTing（谛听）：不替代你的判断，助你接生自己的结论。</desc>

  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="1"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="16" fill="#f6f8fa"/>
  <rect x="6" y="6" width="1188" height="288" rx="12" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- 谛听母题：涟漪（倾听）— 收敛光束 — 焦点（决断） -->
  <g transform="translate(150,150)">
    <circle r="104" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.12"/>
    <circle r="80" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.20"/>
    <circle r="56" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.35"/>
    <circle r="32" fill="none" stroke="#4f46e5" stroke-width="2" opacity="0.6"/>
    <circle r="7" fill="#4f46e5"/>
    <line x1="118" y1="0" x2="300" y2="0" stroke="url(#beam)" stroke-width="3" marker-end="url(#ah)"/>
  </g>
  <g transform="translate(468,150)">
    <path d="M0 -34 L34 0 L0 34 L-34 0 Z" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
    <path d="M0 -14 L14 0 L0 14 L-14 0 Z" fill="#d97706"/>
  </g>

  <!-- 文字 -->
  <text x="540" y="116" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="44" font-weight="700" letter-spacing="0.5" fill="#1f2328">DiTing — thinking protocol</text>
  <text x="542" y="160" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#425066">谛听 · 六环认知引擎 · 认知助产士</text>
  <text x="542" y="204" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#57606a">不替代你的判断 · 助你接生自己的结论</text>

  <text x="1150" y="42" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" letter-spacing="1.5" fill="#57606a">COGNITIVE MIDWIFERY · MIT</text>
</svg>
