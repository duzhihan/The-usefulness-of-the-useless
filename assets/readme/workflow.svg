<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">DiTing six-loop cognitive engine workflow</title>
  <desc id="desc">元层诊断依问题类型与视角，调度六环：锚定、对抗、拆解、表达、成型、验证；每环以确认点暂停。</desc>

  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="1"/>
    </linearGradient>
    <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="16" fill="#f6f8fa"/>
  <rect x="6" y="6" width="1188" height="288" rx="12" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- 顶部标题 -->
  <text x="30" y="40" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1f2328">六环认知引擎 · six-loop cognitive engine</text>
  <text x="30" y="62" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" fill="#57606a">元层诊断（Meta-diagnosis）依问题类型与视角，调度下列六环</text>

  <!-- 元层诊断 -->
  <g>
    <rect x="24" y="92" width="128" height="76" rx="12" fill="#4f46e5"/>
    <text x="88" y="126" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#ffffff">元层诊断</text>
    <text x="88" y="148" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#e0e7ff">Meta-diagnosis</text>
  </g>
  <line x1="152" y1="130" x2="196" y2="130" stroke="url(#flow)" stroke-width="3" marker-end="url(#ah2)"/>

  <!-- 六环 -->
  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- ① 锚定 -->
    <rect x="200" y="92" width="146" height="76" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="224" cy="116" r="13" fill="#4f46e5"/><text x="224" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="248" y="121" font-size="18" font-weight="700" fill="#4f46e5">锚定</text>
    <text x="248" y="139" font-size="11" fill="#57606a">Anchor</text>
    <text x="216" y="160" font-size="11" fill="#6b7280">问出真正卡住的问题</text>
    <!-- ② 对抗 -->
    <rect x="360" y="92" width="146" height="76" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="384" cy="116" r="13" fill="#4f46e5"/><text x="384" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="408" y="121" font-size="18" font-weight="700" fill="#4f46e5">对抗</text>
    <text x="408" y="139" font-size="11" fill="#57606a">Adversarial</text>
    <text x="376" y="160" font-size="11" fill="#6b7280">站在反面挑漏洞</text>
    <!-- ③ 拆解 -->
    <rect x="520" y="92" width="146" height="76" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="544" cy="116" r="13" fill="#4f46e5"/><text x="544" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="568" y="121" font-size="18" font-weight="700" fill="#4f46e5">拆解</text>
    <text x="568" y="139" font-size="11" fill="#57606a">Decompose</text>
    <text x="536" y="160" font-size="11" fill="#6b7280">拆成可分别想清的小块</text>
    <!-- ④ 表达 -->
    <rect x="680" y="92" width="146" height="76" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="704" cy="116" r="13" fill="#4f46e5"/><text x="704" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="728" y="121" font-size="18" font-weight="700" fill="#4f46e5">表达</text>
    <text x="728" y="139" font-size="11" fill="#57606a">Express</text>
    <text x="696" y="160" font-size="11" fill="#6b7280">选定论述基调</text>
    <!-- ⑤ 成型 -->
    <rect x="840" y="92" width="146" height="76" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="864" cy="116" r="13" fill="#4f46e5"/><text x="864" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <text x="888" y="121" font-size="18" font-weight="700" fill="#4f46e5">成型</text>
    <text x="888" y="139" font-size="11" fill="#57606a">Shape</text>
    <text x="856" y="160" font-size="11" fill="#6b7280">汇成带出处的方案</text>
    <!-- ⑥ 验证 -->
    <rect x="1000" y="92" width="146" height="76" rx="12" fill="#4f46e5"/>
    <circle cx="1024" cy="116" r="13" fill="#ffffff"/><text x="1024" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">6</text>
    <text x="1048" y="121" font-size="18" font-weight="700" fill="#ffffff">验证</text>
    <text x="1048" y="139" font-size="11" fill="#e0e7ff">Validate</text>
    <text x="1016" y="160" font-size="11" fill="#e0e7ff">压力测试 + 韧性评分</text>

    <!-- 连接箭头 -->
    <line x1="346" y1="130" x2="358" y2="130" stroke="url(#flow)" stroke-width="3" marker-end="url(#ah2)"/>
    <line x1="506" y1="130" x2="518" y2="130" stroke="url(#flow)" stroke-width="3" marker-end="url(#ah2)"/>
    <line x1="666" y1="130" x2="678" y2="130" stroke="url(#flow)" stroke-width="3" marker-end="url(#ah2)"/>
    <line x1="826" y1="130" x2="838" y2="130" stroke="url(#flow)" stroke-width="3" marker-end="url(#ah2)"/>
    <line x1="986" y1="130" x2="998" y2="130" stroke="url(#flow)" stroke-width="3" marker-end="url(#ah2)"/>
  </g>

  <!-- 底部纪律徽章 -->
  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="220" y="244" width="240" height="34" rx="17" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="340" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#4f46e5">七确认点 C1–C7</text>
    <rect x="480" y="244" width="240" height="34" rx="17" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="600" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#4f46e5">一次一问</text>
    <rect x="740" y="244" width="240" height="34" rx="17" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="860" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#4f46e5">模式可插拔 · 8 张</text>
  </g>
</svg>
